logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.jdbc.datasource.init.ScriptUtils: DEBUG
server:
  error:
    include-message: always
  port: 8090

jwt:
  secret: i9vWD++Wh7XYgQROV1EO0B2KphmDo7r0nC2GR9ErPHM=

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/portal-gaz-db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

  sql:
    init:
      mode: always   # run SQL scripts even for non-embedded DBs
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  liquibase:
    enabled: false

recommendation:
  api:
    url: http://recommendation-api:8000/recommend
